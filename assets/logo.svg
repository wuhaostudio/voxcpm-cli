<svg xmlns="http://www.w3.org/2000/svg" width="240" height="104" viewBox="0 0 240 104">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3776AB"/>
      <stop offset="1" stop-color="#685B4C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FD1E8"/>
      <stop offset="1" stop-color="#DFF6FF"/>
    </linearGradient>
  </defs>

  <!-- background card -->
  <rect width="240" height="88" rx="14" fill="url(#bg)"/>

  <!-- speech-bubble tail: decorative, sits below the card, clear of all content -->
  <path d="M46 88 L30 104 L74 88 Z" fill="#685B4C" opacity="0.9"/>

  <!-- audio waveform: 7 bars, vertically centered at y=44, do not touch the disc -->
  <g fill="url(#wave)">
    <rect x="94"  y="34" width="6" height="20" rx="3"/>
    <rect x="110" y="27" width="6" height="34" rx="3"/>
    <rect x="126" y="18" width="6" height="52" rx="3"/>
    <rect x="142" y="12" width="6" height="64" rx="3"/>
    <rect x="158" y="22" width="6" height="44" rx="3"/>
    <rect x="174" y="30" width="6" height="28" rx="3"/>
    <rect x="190" y="36" width="6" height="16" rx="3"/>
  </g>

  <!-- play button: disc + triangle, kept clear of the waveform (disc ends x=84, bars start x=94) -->
  <circle cx="64" cy="44" r="20" fill="#FFFFFF" opacity="0.92"/>
  <path d="M56 34 L76 44 L56 54 Z" fill="#3776AB"/>
</svg>
