<svg xmlns="http://www.w3.org/2000/svg" width="240" height="88" viewBox="0 0 240 88">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3776AB"/>
      <stop offset="1" stop-color="#685B4C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FD1E8"/>
      <stop offset="1" stop-color="#DFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="240" height="88" rx="14" fill="url(#bg)"/>
  <!-- speech-bubble tail -->
  <path d="M40 88 L24 104 L58 88 Z" fill="#685B4C" opacity="0.9"/>
  <!-- audio waveform bars -->
  <g fill="url(#wave)">
    <rect x="58"  y="34" width="7" height="20" rx="3.5"/>
    <rect x="72"  y="24" width="7" height="40" rx="3.5"/>
    <rect x="86"  y="14" width="7" height="60" rx="3.5"/>
    <rect x="100" y="28" width="7" height="32" rx="3.5"/>
    <rect x="114" y="20" width="7" height="48" rx="3.5"/>
    <rect x="128" y="34" width="7" height="20" rx="3.5"/>
    <rect x="142" y="26" width="7" height="36" rx="3.5"/>
    <rect x="156" y="38" width="7" height="12" rx="3.5"/>
    <rect x="170" y="42" width="7" height="6"  rx="3"/>
  </g>
  <!-- play button disc -->
  <circle cx="44" cy="44" r="18" fill="#FFFFFF" opacity="0.92"/>
  <path d="M39 35 L52 44 L39 53 Z" fill="#3776AB"/>
  <text x="120" y="78" font-family="Segoe UI, sans-serif" font-size="12" fill="#DFF6FF" text-anchor="middle" opacity="0.85">VoxCPM TTS</text>
</svg>
